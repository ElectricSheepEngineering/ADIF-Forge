name: Release

# A tag push is its own ref update. Listening only to tags means a push that
# updates a branch and a tag together starts this workflow for the tag and
# does not start a build of the branch. The job condition repeats that check.
on:
  push:
    tags:
      - "*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Create a draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          if gh release view "$tag" --json isDraft --jq .isDraft > /tmp/draft-state 2>/dev/null; then
            if [ "$(cat /tmp/draft-state)" != "true" ]; then
              echo "Release $tag is already published. An immutable release cannot accept more assets."
              exit 1
            fi
          else
            gh release create "$tag" \
              --draft \
              --title "ADIF Forge $tag" \
              --notes "Standalone executables built from this tag." \
              --target "${{ github.sha }}"
          fi
          id="$(gh release view "$tag" --json databaseId --jq .databaseId)"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --no-bundle --target aarch64-apple-darwin
          - platform: macos-latest
            args: --no-bundle --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: --no-bundle
          - platform: windows-latest
            args: --no-bundle
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload the executable
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseDraft: true
          prerelease: false
          uploadPlainBinary: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          retryAttempts: 3
          releaseAssetNamePattern: "[mainBinaryName]-[platform]-[arch][ext]"
          args: ${{ matrix.args }}

  publish:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
